name: Test Prayer Times

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run prayer time script
        run: |
          python prayer_times.py

      - name: Upload prayer times
        uses: actions/upload-artifact@v4
        with:
          name: prayer-times
          path: prayer_times.json
